<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d4eaff" />
    <script>
      try {
        const theme = localStorage.getItem('dayly.atmosphere') === 'night' ? 'night' : 'morning';
        document.documentElement.dataset.atmosphere = theme;
        document.documentElement.style.colorScheme = theme === 'night' ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'night' ? '#132638' : '#d4eaff';
      } catch {}
    </script>
    <meta
      name="description"
      content="맑은 하루, 차곡차곡 쌓이는 공부. 과목별 할 일과 완료 현황을 관리하는 Dayly."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Dayly — 나의 공부, 나의 하루</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
